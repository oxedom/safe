<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Safe</h1>
    <label class="switch" title="Enable blurring">
      <input type="checkbox" id="enabled"><span></span>
    </label>
  </header>

  <section>
    <label for="threshold">Confidence threshold <output id="thresholdOut"></output></label>
    <input type="range" id="threshold" min="0.05" max="0.95" step="0.05">
  </section>

  <section class="counts">
    <div><b id="scanned">0</b><span>scanned</span></div>
    <div><b id="flagged">0</b><span>flagged</span></div>
    <div><b id="pending">0</b><span>pending</span></div>
    <div><b id="small">0</b><span>&lt;100px skipped</span></div>
  </section>
  <p class="sub" id="detail"></p>

  <section class="opts">
    <label><input type="checkbox" id="debug"> Debug mode (outlines, hover info, click to reveal)</label>
    <label><input type="checkbox" id="blurPending"> Blur images while scanning</label>
    <label>Backend
      <select id="backend">
        <option value="auto">auto (WebGPU → WebGL)</option>
        <option value="webgpu">WebGPU</option>
        <option value="webgl">WebGL</option>
        <option value="cpu">CPU (slow)</option>
      </select>
    </label>
  </section>

  <footer id="model">model: …</footer>
  <script src="../shared/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
